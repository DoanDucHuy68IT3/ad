<section
  class="section carousel-section"
  (mouseenter)="pause()"
  (mouseleave)="resume()"
>

  <!-- HEADER -->
  <div class="carousel-head">

    <div class="carousel-title">

      <span class="eyebrow">
        DÒNG SẢN PHẨM
      </span>

      <h2>
        Giải pháp công nghệ
        <span>AI & IoT</span>
      </h2>

      <p>
        Khám phá các thiết bị thông minh phục vụ
        giám sát, tự động hóa và quản lý môi trường.
      </p>

    </div>


    <!-- CONTROLS -->
    <div class="carousel-controls">

      <button
        type="button"
        class="carousel-btn"
        (click)="scroll('left')"
        aria-label="Sản phẩm trước"
      >
        ←
      </button>

      <button
        type="button"
        class="carousel-btn"
        (click)="scroll('right')"
        aria-label="Sản phẩm tiếp theo"
      >
        →
      </button>

    </div>

  </div>


  <!-- VIEWPORT -->
  <div
    #viewport
    class="carousel-viewport"
  >

    <div class="carousel-track">

      @for (product of products; track product.id) {

        <app-product-card
          [product]="product"
        />

      }

    </div>

  </div>

</section>
