<section id="ai-demo" class="section demo-section">

  <!-- HEADER -->
  <div class="demo-header">

    <span class="eyebrow">Ứng dụng thực tế</span>

    <h2>AI & IoT trong thực tế</h2>

    <p class="lead">
      Khám phá các giải pháp AI và IoT được ứng dụng
      trong nhiều lĩnh vực khác nhau.
    </p>

  </div>


  <!-- CAROUSEL -->
  <div class="demo-carousel">

    <div class="demo-track">

      @for (image of images; track image; let i = $index) {

        <div
          class="demo-slide"
          [class.active]="activeIndex() === i"
        >

          <img
            [src]="image"
            alt="Ứng dụng AI và IoT"
            loading="lazy"
          />

        </div>

      }

    </div>


    <!-- NÚT TRƯỚC -->
    <button
      class="carousel-btn prev"
      type="button"
      (click)="prev()"
      aria-label="Ảnh trước"
    >
      ←
    </button>


    <!-- NÚT SAU -->
    <button
      class="carousel-btn next"
      type="button"
      (click)="next()"
      aria-label="Ảnh tiếp theo"
    >
      →
    </button>


    <!-- DOT -->
    <div class="carousel-dots">

      @for (image of images; track image; let i = $index) {

        <button
          type="button"
          [class.active]="activeIndex() === i"
          (click)="goTo(i)"
          [attr.aria-label]="'Ảnh ' + (i + 1)"
        ></button>

      }

    </div>

  </div>

</section>
