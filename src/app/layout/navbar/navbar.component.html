<header
  class="navbar"
  [class.scrolled]="scrolled()"
>

  <!-- LOGO -->

  <a
    class="logo"
    routerLink="/"
    (click)="closeMenu()"
  >

    <span class="dot"></span>

    <span>
      AI<strong>Camera</strong>
    </span>

  </a>


  <!-- NAVIGATION -->

  <nav
    class="links"
    [class.open]="menuOpen()"
  >

    @for (link of links; track link.path) {

      <a
        [routerLink]="link.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{
          exact: link.path === '/'
        }"
        (click)="closeMenu()"
      >

        {{ link.label }}

      </a>

    }

  </nav>


  <!-- ACTIONS -->

  <div class="actions">

    <a
      class="btn btn-primary order-btn"
      routerLink="/order"
    >
      Đặt hàng
      <span>→</span>
    </a>


    <button
      class="burger"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Menu"
    >

      <span></span>
      <span></span>
      <span></span>

    </button>

  </div>

</header>
