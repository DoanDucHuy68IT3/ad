<header
  class="navbar"
  [class.scrolled]="scrolled()"
>

  <!-- LOGO -->
  <a
    class="logo"
    routerLink="/"
    (click)="closeMenu()"
  >
    <span class="dot"></span>

    <span>
      AI<strong>Camera</strong>
    </span>
  </a>


  <!-- NAVIGATION -->
  <nav
    class="links"
    [class.open]="menuOpen()"
  >

    @for (link of links; track link.path) {

      @if (link.children) {

        <!-- PRODUCTS -->
        <div
          class="nav-dropdown"
          [class.open]="productsOpen()"
        >

          <button
            type="button"
            class="dropdown-trigger"
            (click)="toggleProducts()"
          >
            <span>{{ link.label }}</span>
            <span class="arrow">⌄</span>
          </button>


          <!-- SUB MENU -->
          <div class="dropdown-menu">

            @for (child of link.children; track child.path) {

              <a
                [routerLink]="child.path"
                routerLinkActive="active"
                (click)="closeMenu()"
              >

                <div class="dropdown-icon">
                  <span></span>
                </div>

                <div class="dropdown-content">

                  <strong>
                    {{ child.label }}
                  </strong>

                  <small>
                    {{ child.description }}
                  </small>

                </div>

                <span class="dropdown-arrow">
                  →
                </span>

              </a>

            }

          </div>

        </div>

      } @else {

        <!-- NORMAL LINK -->
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{
            exact: link.path === '/'
          }"
          (click)="closeMenu()"
        >
          {{ link.label }}
        </a>

      }

    }

  </nav>


  <!-- ACTIONS -->
  <div class="actions">

    <a
      class="btn btn-primary order-btn"
      routerLink="/order"
    >
      Đặt hàng
      <span>→</span>
    </a>

    <button
      class="burger"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>

</header>
