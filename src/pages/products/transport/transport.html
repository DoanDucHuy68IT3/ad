<section class="transport-section">
  <div class="header-container">
    <h2 class="main-title">Achieve immediate, organization-wide results</h2>
    <p class="subtitle">Accelerate AI deployment and solve complex challenges across the value chain.</p>
  </div>

  <div class="grid-container">
    <div class="card" *ngFor="let item of features">
      <div class="image-wrapper">
        <img [src]="item.imageUrl" [alt]="item.title" />
      </div>
      <div class="content-wrapper">
        <h3>{{ item.title }}</h3>
        <p>{{ item.description }}</p>
      </div>
    </div>
  </div>
</section>
